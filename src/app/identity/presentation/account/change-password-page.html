<ovyx-auth-layout>
  <form class="login-form" novalidate (submit)="submit($event)">
    <div>
      <div class="eyebrow">Minha conta</div>
      <h1>Trocar senha</h1>
      <p class="muted">Informe a senha atual e escolha a nova.</p>
    </div>

    @if (mustChangePassword()) {
      <ovyx-alert variant="warning">
        <p>Troque a senha provisória para continuar usando o sistema.</p>
      </ovyx-alert>
    }

    @if (notification().hasErrors) {
      <ovyx-error-summary [errors]="notification().errors" [fields]="fields" />
    }

    <ovyx-form-field
      controlId="currentPassword"
      label="Senha atual"
      type="password"
      icon="lock"
      autocomplete="current-password"
      [control]="form.controls.currentPassword"
      [error]="messageFor('currentPassword')"
    />

    <ovyx-form-field
      controlId="newPassword"
      label="Nova senha"
      type="password"
      icon="lock"
      autocomplete="new-password"
      [control]="form.controls.newPassword"
      [error]="messageFor('newPassword')"
    />

    <ovyx-button type="submit" size="lg" icon="check" [block]="true" [busy]="submitting()">Trocar senha</ovyx-button>
  </form>
</ovyx-auth-layout>
