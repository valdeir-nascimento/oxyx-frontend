<form [class]="formClass()" novalidate (submit)="submit($event)">
  <ng-content />

  @if (notification().hasErrors) {
    <ovyx-error-summary [errors]="notification().errors" [fields]="fields" />
  }

  <ovyx-form-field
    controlId="currentPassword"
    label="Senha atual"
    type="password"
    icon="lock"
    autocomplete="current-password"
    [control]="form.controls.currentPassword"
    [error]="messageFor('currentPassword')"
  />

  <ovyx-form-field
    controlId="newPassword"
    label="Nova senha"
    type="password"
    icon="lock"
    autocomplete="new-password"
    [control]="form.controls.newPassword"
    [error]="messageFor('newPassword')"
  />

  @if (variant() === 'screen') {
    <ovyx-button type="submit" size="lg" icon="check" [block]="true" [busy]="submitting()">Trocar senha</ovyx-button>
  } @else {
    <div class="form-actions">
      <ovyx-button variant="secondary" [disabled]="submitting()" (pressed)="cancelled.emit()">Cancelar</ovyx-button>
      <ovyx-button type="submit" icon="check" [busy]="submitting()">Trocar senha</ovyx-button>
    </div>
  }
</form>
