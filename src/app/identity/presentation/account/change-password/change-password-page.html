<ovyx-auth-layout>
  <ovyx-change-password-form (changed)="goHome()">
    <div>
      <div class="eyebrow">Minha conta</div>
      <h1>Trocar senha</h1>
      <p class="muted">Informe a senha atual e escolha a nova.</p>
    </div>

    @if (mustChangePassword()) {
      <ovyx-alert variant="warning">
        <p>Troque a senha provisória para continuar usando o sistema.</p>
      </ovyx-alert>
    }
  </ovyx-change-password-form>
</ovyx-auth-layout>
