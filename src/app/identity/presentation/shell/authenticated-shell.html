@if (caretaker(); as caretaker) {
  <ovyx-authenticated-layout
    [fullName]="caretaker.fullName"
    [roleLabel]="roleLabel()"
    [menuItems]="menuItems()"
    (signOut)="signOut()"
  >
    <ovyx-theme-picker top-bar-actions [value]="theme()" (valueChange)="chooseTheme($event)" />
  </ovyx-authenticated-layout>
}
